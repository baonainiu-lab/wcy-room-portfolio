<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>展位详情 · 本地检查</title><style>body{margin:0;padding:32px;background:#293d39;color:#e9ddc5;font:14px/1.8 sans-serif}button{padding:12px 20px;margin:5px}#state{white-space:pre-wrap;font-size:11px;overflow-wrap:anywhere}iframe{border:1px solid #8d7952;display:block;margin-top:15px}</style><div id="host"></div><script type="module">
import {createExhibitDetail} from '/src/exhibit-detail.js';
import {getGalleryExhibit} from '/src/gallery-catalog.js';
const params=new URLSearchParams(location.search),host=document.querySelector('#host');
if(params.has('phone')){host.innerHTML='<button id="wide">切换宽屏</button><button id="narrow">切换手机</button><iframe title="实际手机视口" width="390" height="844" src="./exhibit-detail-preview.html?child"></iframe>';const childParams=new URLSearchParams(params);childParams.delete('phone');childParams.set('child','');document.querySelector('iframe').src='./exhibit-detail-preview.html?'+childParams;document.querySelector('#wide').onclick=()=>document.querySelector('iframe').width=920;document.querySelector('#narrow').onclick=()=>document.querySelector('iframe').width=390;}else{
host.innerHTML='<button id="open">查看展位 03</button><button id="reopen">快速关闭重开</button><button id="bad">查看失败素材</button><pre id="state"></pre>';
const fixture={index:3,slug:'models',title:'三维建模与渲染',eyebrow:'MODELING / SELECTED STUDIES',subtitle:'相机、室内与汽车的形体和材质练习。',description:'本页是组件验证素材，不改变主网站展位内容。',cover:'/media/resume-book/overview.webp',tags:['Blender','场景设计','材质与灯光'],items:[{id:'camera',title:'相机模型',kicker:'01 / PRODUCT STUDY',description:'通过部件划分与材质对比，组织硬表面的结构关系。\n结合真实作品素材讲述建模过程。',tools:['Blender','Cycles'],image:'/media/resume-book/overview.webp',imageAlt:'实际工作室渲染验证图片',gallery:[{src:'/media/resume-book/projects.webp',alt:'作品项目画面',caption:'第二张详情图'},{src:'/media/resume-book/game-design.webp',alt:'玩法原型',caption:'第三张详情图'}],facts:[{label:'创作类型',value:'三维建模 / 渲染'},{label:'展示内容',value:'结构、材质与灯光'}],note:'验证组件，只复用现有项目图片。'},{id:'living-room',title:'客厅室内设计',kicker:'02 / INTERIOR',description:'室内空间构图、实木与织物材质、自然光照。',image:'/media/resume-book/overview.webp'},{id:'car',title:'跑车模型',kicker:'03 / MOTION',description:'视频播放检查。',video:'/media/works/sugar-shell-glutton/demo-1080p.mp4',image:'/media/works/sugar-shell-glutton/poster.webp',gallery:[{src:'/media/resume-book/game-design.webp',alt:'游戏画面',caption:'图像详情'}]}]};
const exhibit=getGalleryExhibit(params.get('catalog'))||fixture;document.querySelector('#open').textContent='查看展位 '+String(exhibit.index).padStart(2,'0');
let closes=0,playback=false;const detail=createExhibitDetail({reducedMotion:params.has('reduce'),onClose:()=>closes++,onPlaybackChange:playing=>playback=playing});
const open=()=>detail.open({exhibit,origin:{x:150,y:130,width:180,height:220}});document.querySelector('#open').onclick=open;document.querySelector('#reopen').onclick=()=>{open();setTimeout(()=>{detail.close();detail.open({exhibit,origin:{x:150,y:130,width:180,height:220}});},140);};document.querySelector('#bad').onclick=()=>detail.open({exhibit:{...exhibit,items:[{id:'missing',title:'图片错误验证',image:'/missing-exhibit-test.webp',gallery:[{src:'/media/resume-book/overview.webp',alt:'有效图片',caption:'可切换正常图片'}]}]}});setInterval(()=>document.querySelector('#state').textContent=JSON.stringify({...detail.getState(),closes,playback},null,2),150);}
</script></html>

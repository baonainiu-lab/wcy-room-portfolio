<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交互面板布局检查</title><style>body{margin:0;padding:18px;background:#203c45;color:#fff;font:14px system-ui}button{padding:12px 16px;margin:6px}pre{font-size:10px;white-space:pre-wrap}#trigger{margin-top:100px;width:100px;height:80px;background:#a87c52;border:1px solid #e8c594}</style></head><body><button id="work">展架面板</button><button id="book">简历书</button><div id="trigger" aria-label="来源位置"></div><pre id="status"></pre><script type="module">
import{createWorkDetail}from'/src/work-detail.js';import{createResumeBook}from'/src/resume-book.js';const reducedMotion=new URLSearchParams(location.search).has('reduce');let closed=0;const work=createWorkDetail({reducedMotion,onClose:()=>closed++}),book=createResumeBook({reducedMotion,onClose:()=>closed++});const origin=()=>{const r=document.querySelector('#trigger').getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}};document.querySelector('#work').onclick=()=>work.open({origin:origin()});document.querySelector('#book').onclick=()=>book.open({origin:origin()});setInterval(()=>{document.querySelector('#status').textContent=JSON.stringify({viewport:[innerWidth,innerHeight],closed,work:work.getState(),book:book.getState()})},100);
</script></body></html>
